name: Scan with SonarScanner
on: [ push, pull_request ]
env:
  CCACHE_COMPRESS: exists means true
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
jobs:
  sonar-scan:
    name: Scan with SonarScanner
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    services:
      elasticsearch8:
        image: elastic/elasticsearch:8.11.1
        options: >-
          --env ES_JAVA_OPTS="-Xms512m -Xmx512m"
          --env discovery.type=single-node
          --env xpack.security.enabled=false
          --env xpack.security.http.ssl.enabled=false
          --env action.destructive_requires_name=false
          --env cluster.routing.allocation.disk.threshold_enabled=false
          --publish 9200:9200
    steps:
    - name: Download and install latest SonarScanner CLI tool
      run: |
        SONAR_SCANNER_VERSION=`curl -w %{redirect_url} \
             https://github.com/SonarSource/sonar-scanner-cli/releases/latest \
             2>/dev/null | cut -f8 -d'/'`
        SONAR_DOWNLOAD_PATH=https://binaries.sonarsource.com/Distribution/sonar-scanner-cli
        curl --create-dirs --fail -sSLo $HOME/.sonar/sonar-scanner.zip \
             $SONAR_DOWNLOAD_PATH/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
        unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
        curl --create-dirs -sSLo $HOME/.sonar/build-wrapper-linux-x86.zip \
             https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
        unzip -o $HOME/.sonar/build-wrapper-linux-x86.zip -d $HOME/.sonar/
        SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
        echo "SONAR_SCANNER_VERSION=$SONAR_SCANNER_VERSION" >> $GITHUB_ENV
        echo "SONAR_SCANNER_HOME=$SONAR_SCANNER_HOME" >> $GITHUB_ENV
        echo "SONAR_SCANNER_OPTS=-server" >> $GITHUB_ENV
        echo "$SONAR_SCANNER_HOME/bin" >> $GITHUB_PATH
        echo "$HOME/.sonar/build-wrapper-linux-x86" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        df -h
        sudo apt-get update
        openssl_ver=`sudo apt-cache madison openssl | grep xenial-updates | awk '{print $3}'`
        libssl_ver=`sudo apt-cache madison libssl-dev | grep xenial-updates | awk '{print $3}'`
        [ -n "${openssl_ver}" ] && [ -n "${libssl_ver}" ] && \
          sudo apt-get install -y --allow-downgrades openssl=${openssl_ver} libssl-dev=${libssl_ver}
        sudo apt-get install -y \
                     ccache \
                     gcovr \
                     parallel \
                     libboost-thread-dev \
                     libboost-iostreams-dev \
                     libboost-date-time-dev \
                     libboost-system-dev \
                     libboost-filesystem-dev \
                     libboost-program-options-dev \
                     libboost-chrono-dev \
                     libboost-test-dev \
                     libboost-context-dev \
                     libboost-regex-dev \
                     libboost-coroutine-dev \
                     libcurl4-openssl-dev
        sudo apt-get auto-remove -y
        sudo apt-get clean -y
        df -h
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Configure
      run: |
        pwd
        df -h .
        free
        mkdir -p _build
        sed -i '/tests/d' libraries/fc/CMakeLists.txt
        pushd _build
        export -n BOOST_ROOT BOOST_INCLUDEDIR BOOST_LIBRARYDIR
        cmake -D CMAKE_BUILD_TYPE=Debug \
              -D CMAKE_CXX_OUTPUT_EXTENSION_REPLACE=ON \
              -D CMAKE_C_COMPILER=gcc \
              -D CMAKE_C_COMPILER_LAUNCHER=ccache \
              -D CMAKE_CXX_COMPILER=g++ \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D CMAKE_C_FLAGS=--coverage \
              -D CMAKE_CXX_FLAGS=--coverage \
              -D Boost_USE_STATIC_LIBS=OFF \
              ..
        popd
    # Get OS version to be used in cache key - see https://github.com/actions/cache/issues/543
    - run: |
        echo "OS_VERSION=`lsb_release -sr`" >> $GITHUB_ENV
    - name: Load Cache
      uses: actions/cache@v6
      with:
        path: |
          ccache
        key: sonar-${{ env.OS_VERSION }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          sonar-${{ env.OS_VERSION }}-${{ github.ref }}-
          sonar-${{ env.OS_VERSION }}-
    - name: Build
      run: |
        export CCACHE_DIR="$GITHUB_WORKSPACE/ccache"
        mkdir -p "$CCACHE_DIR"
        df -h
        programs/build_helpers/make_with_sonar bw-output -j 2 -C _build \
          witness_node cli_wallet js_operation_serializer get_dev_key network_mapper \
          app_test chain_test cli_test es_test
        df -h
        du -hs _build/libraries/* _build/programs/* _build/tests/*
        du -hs _build/*
    - name: Quick test for program arguments
      run: |
        _build/programs/witness_node/witness_node --version
        _build/programs/witness_node/witness_node --help
        if _build/programs/witness_node/witness_node --bad-arg ; then \
          echo "Fail: did not get expected error."; false; \
        else \
          echo "Pass: got expected error."; \
        fi
        if _build/programs/witness_node/witness_node --plugins "account_history elasticsearch" ; then \
          echo "Fail: did not get expected error."; false; \
        else \
          echo "Pass: got expected error."; \
        fi
        if _build/programs/witness_node/witness_node --rpc-endpoint --plugins "witness"; then \
          echo "Fail: did not get expected error."; false; \
        else \
          echo "Pass: got expected error."; \
        fi
        _build/programs/cli_wallet/cli_wallet --version
        _build/programs/cli_wallet/cli_wallet --help
        _build/programs/cli_wallet/cli_wallet --suggest-brain-key
        if _build/programs/cli_wallet/cli_wallet --bad-arg ; then \
          echo "Fail: did not get expected error."; false; \
        else \
          echo "Pass: got expected error."; \
        fi
    - name: Remove binaries that we no longer need
      run: |
        df -h
        echo "Cleanup"
        rm -rf _build/programs/witness_node/witness_node
        rm -rf _build/programs/cli_wallet/cli_wallet
        rm -rf _build/programs/network_mapper/network_mapper
        rm -rf _build/programs/js_operation_serializer/js_operation_serializer
        rm -rf _build/programs/genesis_util/get_dev_key
        df -h
    - name: Unit-Tests
      # The other workflows run these binaries in 15 minutes, but this job builds them Debug
      # with --coverage, which is several times slower to execute. At 15 minutes the step was
      # killed mid-run ("The action 'Unit-Tests' has timed out after 15 minutes"), so the
      # scanner steps after it never ran at all and the whole workflow had never once reported
      # on the code it was supposed to scan.
      timeout-minutes: 45
      run: |
        # Which of these four fails has never been visible. The step reports "exit code 1" and
        # nothing else, and the log needs admin rights on the repository, so the same bare
        # number has been showing up on this branch, on the feature branches and on upstream
        # develop without ever saying which binary produced it. Each one now names itself.
        #
        # Deliberately not a single grouped command with a pipe: a failure in the middle of a
        # group does not stop the group, and an earlier attempt at this reported success while
        # a binary underneath it had failed. Every invocation is checked on its own, and the
        # cleanups between them are left exactly where they were -- the sequence matters.
        lauf() {
          echo "+ $*"
          set +e
          "$@"
          local rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::Unit-Tests: $1 exited ${rc}"
            exit $rc
          fi
        }
        lauf _build/tests/app_test -l test_suite
        df -h
        echo "Cleanup"
        rm -rf /tmp/graphene*
        lauf _build/tests/es_test -l test_suite
        df -h
        echo "Cleanup"
        rm -rf /tmp/graphene*
        lauf libraries/fc/tests/run-parallel-tests.sh _build/tests/chain_test -l test_suite
        df -h
        echo "Cleanup"
        rm -rf /tmp/graphene*
        lauf _build/tests/cli_test -l test_suite
        df -h
        echo "Cleanup"
        rm -rf /tmp/graphene*
        df -h
    - name: Prepare for scanning with SonarScanner
      run: |
        # This step reports only "exit code 64" and its log needs admin rights to read, so
        # each command has to say for itself whether it was the one that failed.
        if ! programs/build_helpers/set_sonar_branch_for_github_actions sonar-project.properties; then
          echo "::error::set_sonar_branch_for_github_actions failed"
          exit 1
        fi
        echo "gcovr version: $(gcovr --version 2>&1 | head -1)"
        pushd _build
        echo "cwd=$(pwd)"
        echo "root as gcovr sees it: $(cd .. && pwd)"
        ls -d ../libraries ../programs >/dev/null 2>&1 \
          || echo "::error::the repository root does not look right from inside _build"
        set +e
        gcovr --exclude-unreachable-branches --exclude-throw-branches \
              --exclude '\.\./programs/' \
              --exclude '\.\./tests/' \
              --sonarqube ../coverage.xml -r .. > ../gcovr.out 2>&1
        rc=$?
        set -e
        if [ $rc -ne 0 ]; then
          # gcovr 7.0: EXIT_CMDLINE_ERROR is 1, EXIT_READ_ERROR is 64. A 64 therefore means
          # it could not read the coverage data, and it logs the exception before exiting --
          # which is in the step log, and the step log needs admin rights on the repository.
          # So the lines that name the cause are lifted into annotations here.
          echo "::error::gcovr exited ${rc} (64 = read error), $(gcovr --version 2>&1 | head -1)"
          grep -aE '\(ERROR\)|Error occurred|Exception|No such file|not found|version' ../gcovr.out \
            | head -6 | while IFS= read -r line; do echo "::error::gcovr: ${line}"; done
          tail -4 ../gcovr.out | while IFS= read -r line; do echo "::error::gcovr tail: ${line}"; done
          exit $rc
        fi
        popd
    - name: Scan with SonarScanner
      env:
        # to get access to secrets.SONAR_TOKEN, provide GITHUB_TOKEN
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sonar-scanner \
           -Dsonar.login=${{ secrets.SONAR_TOKEN }}
    - name: Cleanup
      run: |
        df -h
        echo "Final cleanup"
        rm -rf _build/tests/app_test
        rm -rf _build/tests/chain_test
        rm -rf _build/tests/cli_test
        rm -rf _build/tests/es_test
        df -h
